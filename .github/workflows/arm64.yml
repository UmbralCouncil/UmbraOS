name: Build ARM64 UEFI image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the ARM64 image catalog
        run: nix build .#checks.aarch64-linux.images-schema --no-link
      - name: Build the UEFI live installer
        run: nix build .#packages.aarch64-linux.iso --out-link result-arm64
      - name: Check image size
        run: nix build .#nixosConfigurations.umbra-live-arm64.config.system.build.umbraIsoSizeCheck --no-link
      - name: Prepare artifact and checksum
        run: |
          mkdir dist
          cp result-arm64/iso/*.iso dist/
          cd dist
          sha256sum *.iso > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: UmbraOS-aarch64-linux
          path: dist/*
          if-no-files-found: error
