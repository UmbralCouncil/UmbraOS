[package]
name = "umbra-updater"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "umbra-update-backend"
path = "backend.rs"

[[bin]]
name = "umbra-update"
path = "client.rs"

[[bin]]
name = "umbra-update-ui"
path = "gui.rs"
